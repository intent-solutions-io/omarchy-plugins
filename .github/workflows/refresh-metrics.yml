name: refresh-metrics

# The public catalogue is generated from the official marketplace catalogue and
# metrics endpoints plus bounded GitHub API reads for repository health.
#
# This commits straight to main on purpose. The only thing it can change is the
# generated catalogue surfaces, the change carries no review value, and a queue of
# open "facts moved" pull requests is worse than no automation.
# The pull_request lane checks agreement between the committed generated surfaces
# without racing live engagement counters that can change during the run.

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "plugins.json"
      - "scripts/**"
      - "site/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  refresh:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Regenerate the metrics table
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/refresh-metrics.sh
      - name: Commit if public facts moved
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md site/data/plugins.json site/index.html site/plugins; then
            echo "no change: public catalogue facts are unmoved."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md site/data/plugins.json site/index.html site/plugins
          git commit \
            -m "chore(catalogue): refresh public plugin facts" \
            -m "Regenerated by scripts/refresh-metrics.sh from the official Omarchy marketplace and the GitHub API. Generated content only."
          git push

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Check generated surface agreement
        run: bash scripts/check-site.sh
