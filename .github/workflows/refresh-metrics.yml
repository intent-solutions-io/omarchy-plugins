name: refresh-metrics

# The metrics table in README.md is generated from two live marketplace endpoints.
# At this marketplace's pace it goes stale within a week, so it is refreshed on a
# schedule rather than by hand.
#
# This commits straight to main on purpose. The only thing it can change is the
# generated block between the METRICS markers, the change carries no review value,
# and a queue of open "numbers moved" pull requests is worse than no automation.
# The pull_request lane runs --check instead, so a hand-edited table fails the PR.

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "README.md"
      - "plugins.json"
      - "scripts/refresh-metrics.sh"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate the metrics table
        run: bash scripts/refresh-metrics.sh
      - name: Commit if the numbers moved
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "no change: marketplace numbers are unmoved."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(metrics): refresh the live marketplace table

Regenerated by scripts/refresh-metrics.sh from omarchyplugins.com/catalog.json
and api.omarchyplugins.com/v1/stats. Generated content only."
          git push

  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if the table was hand-edited or is stale
        run: bash scripts/refresh-metrics.sh --check
